# example.com — the toy domain. A real manifest describes a real supplier;
# every field below is read by the runtime (see README §3).
protocol_version: 1
domain: example.com
recipe: recipe.mjs

capabilities:                    # what this recipe implements (adr/0001); absent = this default.
  search:                        # each task references a VERSIONED input contract in
    input_schema: air-search.v1  # schemas/input/ — public field names, not transport env
  offer-details:
    input_schema: air-offer-details.v1
  book:
    input_schema: air-book.v1
    accepts: [offer_ref]         # what a book target may be; later: url (fulfill-only recipes)

flow: ephemeral-account          # the supplier sells to accounts only: one per ORDER (§2.6-bis)
kind: browser                    # browser | api (a connector speaks the same signals)

oracle:
  type: email                    # settlement truth = the supplier's confirmation email
  template: example_v1           # version label of the patterns below
  # The patterns ARE the template: the marketplace's settlement engine
  # executes them once the domain is live. YOU supply the domain
  # knowledge; DKIM verification, sender alignment and the capture
  # decision stay the marketplace's — your declaration never moves money.
  # No sample email in hand? OMIT all three patterns (all-or-none):
  # that is BOOTSTRAP mode — nothing settles yet, and the FIRST real
  # confirmation (delivered to the marketplace's own order address)
  # pages the operator, the patterns get written against the genuine
  # article, and the booking settles retroactively inside its hold.
  issued_pattern: '(?i)ticket[s]?\s+(?:have|has)\s+been\s+issued'
  pnr_pattern: '(?i)Booking\s+Reference\s*:\s*([A-Z0-9]{5,8})'   # group 1 = the PNR
  cancelled_subject_pattern: '(?i)\b(cancel(?:led|ed)?|refund(?:ed)?|failed)\b' 

coverage:                        # bounds the search fan-out — quote only what you can book
  regions: [EU]
  cabins: [Y]
  trip_types: [ow]

payment:
  currency: USD
  max_amount: 150                # above this, orders are not routed here


known_traps:                     # what you learned the hard way — quote strings containing ':'
  - "the toy supplier has no traps; a real one has many — write them down here"

author:
  partner: example               # a label; the wallet below is the identity
  # REQUIRED, and it must be the wallet that pays for the submission: it is
  # what lets you read this recipe back (GET /recipes/source/<domain>).
  wallet: 9a6pGJsb9gUoYJVWvrBDGxm2Yvqti9AKs6tEL9maZBG7
  primary: true
