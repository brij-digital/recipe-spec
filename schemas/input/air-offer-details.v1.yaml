# air-offer-details.v1 — the PUBLIC input contract of the fare drill-down.
# Transport: the RECIPE_INPUT document (see air-search.v1).
schema: air-offer-details.v1
task: offer-details
required:
  - origin_iata       # the originating search is replayed, so it travels too
  - destination_iata
  - depart_date       # YYYY-MM-DD
  - flight            # an offer id THIS recipe's own search produced
  - adults            # 1..9 — the same party the search was priced for
  - cabin_class       # the same cabin. A fare menu is priced for both:
                      # reading a one-adult economy menu and selling it as the
                      # fare for two in business is the same wrong number as
                      # on the search, one step later and harder to notice.
optional:
  - return_date       # YYYY-MM-DD
  - return_flight     # round-trip: the return leg's offer id
runtime_provides:
  - browser_session
  - llm
