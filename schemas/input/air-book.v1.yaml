# air-book.v1 — the PUBLIC input contract of a purchase.
# Transport: the RECIPE_INPUT document (see air-search.v1).
#
# Card data, keys, OTP and approval are NEVER free inputs an author may
# declare: they are runtime_provides, controlled and injected by the
# marketplace's runtime (ADR 0001 — no fulfill without a settlement oracle).
#
# NO PRICE CEILING is passed. A cap re-implemented by every recipe is a cap
# every recipe can get wrong, and one of them did. The marketplace compares
# the cashier total you report against what the customer engaged, at the
# approval gate, before the card is touched. What you owe it is an honest
# total and an honest currency — see the result contract.
schema: air-book.v1
task: book
required:
  - origin_iata
  - destination_iata
  - depart_date       # YYYY-MM-DD
  - flight            # the offer being bought, from this recipe's discovery
  - passengers        # ordered; position 0 is the LEAD (the name refunds match)
                      # each: {given, surname, dob} + optional
                      # {gender, nationality, idnum, idexp}
                      # dob and idexp are ISO (YYYY-MM-DD); gender is the raw
                      # API code (m/f), never a supplier's form label
  - contact_email     # the order's oracle address (o-<id>@bookings.brij.fi):
                      # give it to the supplier as the booking contact, or the
                      # confirmation never reaches settlement and nothing captures
optional:
  - return_date       # YYYY-MM-DD
  - return_flight
  - fare_index        # the chosen brand's index from offer-details
  - fare_price        # that brand's expected supplier price — the fare's real
                      # identity. Resolve against the LIVE menu; the index is
                      # only a tiebreak among equal prices, because suppliers
                      # reorder menus between drill-down and purchase
  - contact_phone     # E.164, "+<dial><national>"
runtime_provides:
  - payment_method    # card fields, injected only in a paying mode
  - approval          # human gate verdict (signal file)
  - otp               # 3-D Secure code relay (signal file)
  - ephemeral_account # flow: ephemeral-account only — ACCOUNT_PASSWORD generated per
                      # run, and the email verification relayed through a signal file.
                      # The account's email IS contact_email (the order's address).
  - browser_session
  - llm
